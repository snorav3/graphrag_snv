services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "./qdrant_data:/qdrant/storage"
  neo4j:
    image: neo4j:latest
    environment:
        NEO4J_AUTH: neo4j/my_passwd
        NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/logs:/logs
      - ./neo4j/conf:/conf
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins